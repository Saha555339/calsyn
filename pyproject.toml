[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calsyn"
version = "0.1.0"
description = "Calibrated Synthetic Data Generator for Monte Carlo simulations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Aleksandr Burov"},
]
keywords = ["synthetic data", "monte carlo", "catboost", "calibration", "causal inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.10",
    "catboost>=1.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
tune = ["optuna>=3.0"]
dev = [
    "optuna>=3.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/Saha555339/calsyn"
Repository = "https://github.com/Saha555339/calsyn"

[tool.setuptools.packages.find]
include = ["calsyn*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
